[project]
name = "energy-storage"
version = "0.1.0"
description = "Battery storage arbitrage environment for RL"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "gymnasium>=1.0"]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["energy_storage"]
